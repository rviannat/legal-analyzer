server:
  port: 8080

spring:
  application:
    name: legal-analyzer
  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 25MB

# Configurações específicas da aplicação (ver AppProperties.java)
legal-analyzer:
  ai:
    # Provedor de IA: "ollama" (padrão, modelo local) ou "anthropic"
    provider: ${AI_PROVIDER:ollama}
    # No Ollama local não há chave de API; use apenas se houver proxy/gateway com bearer token
    api-key: ${OLLAMA_API_KEY:}
    model: ${OLLAMA_MODEL:llama3.1:8b}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434/api/chat}
    max-tokens: ${OLLAMA_MAX_TOKENS:4096}
    temperature: ${OLLAMA_TEMPERATURE:0.2}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:600}
    # num_ctx: precisa acomodar prompt + chunk (chunk-char-size / ~3.5 chars por token)
    context-window: ${OLLAMA_CONTEXT_WINDOW:16384}
    # format=json — obriga o modelo a devolver JSON válido (todos os agentes esperam JSON)
    json-mode: ${OLLAMA_JSON_MODE:true}
    # mantém o modelo carregado em memória entre as chamadas da pipeline
    keep-alive: ${OLLAMA_KEEP_ALIVE:30m}
  pdf:
    max-file-size-bytes: 26214400      # 25MB
    chunk-char-size: 20000             # ~ tamanho de trecho enviado por chamada de IA
    chunk-overlap-chars: 2000          # sobreposição entre trechos para não perder contexto

logging:
  level:
    com.rafaelvianna.legalanalyzer: INFO
