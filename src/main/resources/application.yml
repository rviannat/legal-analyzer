server:
  port: 8080

spring:
  application:
    name: legal-analyzer
  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 25MB

# Configurações específicas da aplicação (ver AppProperties.java)
legal-analyzer:
  ai:
    provider: ${AI_PROVIDER:ollama}
    api-key: ${OLLAMA_API_KEY:}
    model: ${OLLAMA_MODEL:llama3.2:3b}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434/api/chat}
    max-tokens: ${OLLAMA_MAX_TOKENS:1024}
    temperature: ${OLLAMA_TEMPERATURE:0.1}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:300}
    context-window: ${OLLAMA_CONTEXT_WINDOW:2048}
    json-mode: ${OLLAMA_JSON_MODE:true}
    keep-alive: ${OLLAMA_KEEP_ALIVE:30m}

  pdf:
    max-file-size-bytes: 26214400
    chunk-char-size: 6000
    chunk-overlap-chars: 500          # sobreposição entre trechos para não perder contexto

  especializada:
    # amostra do texto original enviada aos agentes especializados
    amostra-texto-chars: ${ESPECIALIZADA_AMOSTRA_CHARS:16000}
    # quantidade maxima de rascunhos por requisicao (Drafting Agent)
    max-rascunhos: ${ESPECIALIZADA_MAX_RASCUNHOS:5}
    # tamanho maximo aproximado de cada rascunho gerado
    max-chars-rascunho: ${ESPECIALIZADA_MAX_CHARS_RASCUNHO:8000}
  # Pesquisa juridica: SOMENTE fontes autorizadas e rastreaveis.
  # Desabilitada por padrao -> o Legal Research Agent informa que nao pesquisou,
  # em vez de permitir que o modelo cite legislacao/jurisprudencia de memoria.
  legal-research:
    enabled: ${LEGAL_RESEARCH_ENABLED:false}
    # allowlist de dominios: qualquer URL fora desta lista e' recusada (inclusive apos redirect)
    dominios-autorizados:
      - planalto.gov.br
      - lexml.gov.br
      - stf.jus.br
      - stj.jus.br
      - tst.jus.br
      - cnj.jus.br
      - senado.leg.br
      - camara.leg.br
      - in.gov.br
    # endpoints de busca; {consulta} e' substituido pela consulta (URL-encoded)
    fontes:
      - nome: "LexML - legislacao e jurisprudencia (Rede de Informacao Legislativa e Juridica)"
        url-template: "https://www.lexml.gov.br/busca/search?keyword={consulta}"
      - nome: "STF - pesquisa de jurisprudencia"
        url-template: "https://jurisprudencia.stf.jus.br/pages/search?base=acordaos&query={consulta}"
      - nome: "STJ - pesquisa de jurisprudencia"
        url-template: "https://scon.stj.jus.br/SCON/pesquisar.jsp?b=ACOR&livre={consulta}"
    max-chars-por-fonte: ${LEGAL_RESEARCH_MAX_CHARS:8000}
    max-fontes-por-consulta: ${LEGAL_RESEARCH_MAX_FONTES:3}
    timeout-seconds: ${LEGAL_RESEARCH_TIMEOUT_SECONDS:20}

  # RAG: indice do caso (PDF por pagina + fichas da analise), briefing de
  # assuncao e chat ancorado. A busca lexica funciona sempre; os embeddings
  # sao opcionais e, se falharem, o indice continua respondendo em modo lexico.
  rag:
    # requer: ollama pull nomic-embed-text
    embeddings-habilitados: ${RAG_EMBEDDINGS_ENABLED:false}
    embedding-model: ${RAG_EMBEDDING_MODEL:nomic-embed-text}
    embedding-base-url: ${RAG_EMBEDDING_BASE_URL:http://localhost:11434/api/embeddings}
    embedding-timeout-seconds: ${RAG_EMBEDDING_TIMEOUT_SECONDS:60}
    tamanho-passagem-chars: ${RAG_TAMANHO_PASSAGEM:1200}
    sobreposicao-passagem-chars: ${RAG_SOBREPOSICAO_PASSAGEM:200}
    max-passagens-indexadas: ${RAG_MAX_PASSAGENS:4000}
    max-passagens-por-resposta: ${RAG_MAX_PASSAGENS_RESPOSTA:8}
    score-minimo: ${RAG_SCORE_MINIMO:0.05}
    max-mensagens-historico: ${RAG_MAX_HISTORICO:6}

logging:
  level:
    com.rafaelvianna.legalanalyzer: INFO
