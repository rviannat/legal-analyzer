# Copie este arquivo de referência de variáveis de ambiente para configurar
# a aplicação. As mesmas chaves em application.yml já leem estas variáveis
# de ambiente automaticamente (ex.: ${OLLAMA_MODEL:llama3.2:3b}).
#
# --- Padrão: Ollama (modelo local, nenhum dado sai da máquina) ---
#
#   export AI_PROVIDER="ollama"
#   export OLLAMA_MODEL="llama3.2:3b"
#   export OLLAMA_BASE_URL="http://localhost:11434/api/chat"
#   export OLLAMA_MAX_TOKENS="4096"
#   export OLLAMA_TEMPERATURE="0.2"
#   export OLLAMA_TIMEOUT_SECONDS="600"
#   export OLLAMA_CONTEXT_WINDOW="16384"
#   export OLLAMA_JSON_MODE="true"
#   export OLLAMA_KEEP_ALIVE="30m"
#   export OLLAMA_API_KEY=""            # só se o Ollama estiver atrás de proxy com bearer token
#
# --- Alternativa: Anthropic (Claude) ---
#
#   export AI_PROVIDER="anthropic"
#   export OLLAMA_API_KEY="sk-ant-..."   # a chave é lida da mesma propriedade legal-analyzer.ai.api-key
#   export OLLAMA_MODEL="claude-sonnet-4-5"
#   export OLLAMA_BASE_URL="https://api.anthropic.com/v1/messages"
#
# Para deixar mais claro ao usar Anthropic, você também pode sobrescrever
# diretamente as propriedades Spring:
#
#   --legal-analyzer.ai.provider=anthropic \
#   --legal-analyzer.ai.api-key=sk-ant-... \
#   --legal-analyzer.ai.model=claude-sonnet-4-5 \
#   --legal-analyzer.ai.base-url=https://api.anthropic.com/v1/messages
#
# --- Análise especializada (8 agentes) ---
#
#   export ESPECIALIZADA_AMOSTRA_CHARS="16000"       # amostra de texto enviada aos agentes
#   export ESPECIALIZADA_MAX_RASCUNHOS="5"          # rascunhos por requisição
#   export ESPECIALIZADA_MAX_CHARS_RASCUNHO="8000"  # tamanho máximo de cada rascunho
#
# --- Pesquisa jurídica (Legal Research Agent) ---
#
# Desabilitada por padrão. Com ela desligada, o agente informa que não pesquisou
# e NENHUMA legislação ou jurisprudência é citada — evita referência inventada.
#
#   export LEGAL_RESEARCH_ENABLED="true"
#   export LEGAL_RESEARCH_MAX_CHARS="8000"
#   export LEGAL_RESEARCH_MAX_FONTES="3"
#   export LEGAL_RESEARCH_TIMEOUT_SECONDS="20"
#
# A allowlist de domínios e as fontes (url-template com {consulta}) ficam em
# application.yml, em legal-analyzer.legal-research. Só URLs cujo host esteja
# na allowlist são baixadas — a checagem é refeita após cada redirecionamento.
# Para adicionar uma fonte própria (ex.: tribunal estadual ou base interna),
# inclua o domínio na allowlist e a url-template na lista de fontes.
#
# --- RAG: briefing de assuncao + chat com o processo ---
#
# A busca lexica funciona sempre. Os embeddings sao opcionais e, se o modelo
# nao estiver disponivel, o indice cai automaticamente para o modo lexico
# (com aviso no log) em vez de derrubar a analise.
#
#   ollama pull nomic-embed-text
#
#   export RAG_EMBEDDINGS_ENABLED="true"
#   export RAG_EMBEDDING_MODEL="nomic-embed-text"
#   export RAG_EMBEDDING_BASE_URL="http://localhost:11434/api/embeddings"
#   export RAG_EMBEDDING_TIMEOUT_SECONDS="60"
#   export RAG_TAMANHO_PASSAGEM="1200"        # tamanho de cada passagem indexada
#   export RAG_SOBREPOSICAO_PASSAGEM="200"
#   export RAG_MAX_PASSAGENS="4000"           # teto de passagens por caso
#   export RAG_MAX_PASSAGENS_RESPOSTA="8"     # trechos no contexto de cada resposta
#   export RAG_SCORE_MINIMO="0.05"            # corte de relevancia na recuperacao
#   export RAG_MAX_HISTORICO="6"              # mensagens de historico reenviadas
#
# Endpoints:
#   GET  /api/v1/processos/analises/{id}/briefing      -> dossie em JSON
#   GET  /api/v1/processos/analises/{id}/briefing.md   -> dossie em Markdown
#   POST /api/v1/processos/analises/{id}/chat          -> pergunta ancorada
#   GET  /api/v1/processos/chats/{sessaoId}            -> historico da conversa
#   GET  /api/v1/processos/analises/{id}/indice        -> diagnostico do indice
